<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2e">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Blåtur 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a full-screen stage holding only the button; it turns into a departure board, and the program and city guide unfold below. Single dark look: night over the Mediterranean. */
:root{
  --night:#0b1a2e;
  --deep:#11253f;
  --board:#060d18;
  --tile:#152a45;
  --ink:#eef2f7;
  --muted:#93a6be;
  --line:#24405f;
  --amber:#ffb547;
  --amber-shadow:#b9761b;
  --sea:#4fb3d9;
  --cloud:#c9d5e3;
  --map-sea:#0e3354;
  --map-wave:#1f5a85;
  --map-land:#1a2f4a;
  --map-street:#3a5878;
  --map-hill:#2a4262;
  --map-hill2:#355276;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--night)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Stage */
.stage{box-sizing:border-box;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:32px;position:relative}
@supports (min-height:100svh){.stage{min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}

button.reveal{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,34px);letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:var(--board);border:0;border-radius:6px;padding:20px 34px;cursor:pointer;box-shadow:0 7px 0 var(--amber-shadow);transition:transform .15s ease,box-shadow .15s ease,opacity .3s ease;touch-action:manipulation}
button.reveal:hover{transform:translateY(-2px);box-shadow:0 9px 0 var(--amber-shadow)}
button.reveal:active{transform:translateY(5px);box-shadow:0 2px 0 var(--amber-shadow)}
button.reveal:focus-visible{outline:3px solid var(--sea);outline-offset:5px}
button.reveal.out{opacity:0;transform:scale(.94);pointer-events:none}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--amber-shadow),0 0 0 0 rgba(255,181,71,.35)}50%{box-shadow:0 7px 0 var(--amber-shadow),0 0 0 18px rgba(255,181,71,0)}}

/* Departure board */
.board{width:100%;max-width:640px;background:var(--board);border:1px solid var(--line);border-radius:8px;padding:18px 14px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px -24px rgba(0,0,0,.8)}
.board.in{animation:boardin .45s ease both}
@keyframes boardin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.board-head{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;overflow:hidden}
.cell{display:flex;flex-direction:column;gap:8px}
.flaps{display:flex;justify-content:center;gap:4px;container-type:inline-size;width:100%}
.flap{flex:1 1 0;max-width:62px;aspect-ratio:3/4;background:var(--tile);border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:24px;font-size:clamp(16px,9.5cqi,42px);color:var(--amber);position:relative;overflow:hidden;line-height:1}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board)}
.flaps.small .flap{max-width:38px;font-size:20px;font-size:clamp(14px,5.4cqi,26px)}
.flap.tick{animation:tick .07s linear}
@keyframes tick{from{transform:scaleY(.65)}to{transform:scaleY(1)}}
.board-foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.status{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.status.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.gate{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

.scrollhint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none}
.scrollhint svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.fadein{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Content */
#content{max-width:720px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:44px}
#content.in{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);margin:0 0 6px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(38px,10vw,56px);line-height:1;margin:0 0 14px;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 12px;color:var(--amber)}
.lead{font-size:18px;margin:0;max-width:62ch}

.program p.note{color:var(--muted);margin:0 0 16px}
.program .booking{margin-bottom:12px}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 20px;border:1px solid var(--line);background:var(--deep);border-radius:6px;padding:16px}
.day .head{display:flex;flex-direction:column;gap:2px}
.day .when{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day .what{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05;text-transform:uppercase}
.day .body{display:flex;flex-direction:column;gap:12px;min-width:0}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:baseline}
.items .time{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.items b{font-weight:700}
.lock{font-family:var(--mono);font-size:12px;color:var(--sea);display:flex;align-items:center;gap:6px}
.lock svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
@media (max-width:560px){.day{grid-template-columns:1fr}}

.wxgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.wxgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wx{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.wx-day{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;width:100%;gap:8px}
.wx-day b{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase}
.wx-day span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wx svg{width:64px;height:64px;margin:4px 0}
.wx-t{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.wx-d{font-weight:600}
.wx-m{font-size:13px;color:var(--muted)}
.weather .src{font-size:13px;color:var(--muted);margin:12px 0 0}
.weather .src a{color:var(--sea)}
.carousel-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.carousel:focus-visible{outline:2px solid var(--sea);outline-offset:4px;border-radius:6px}
.pcard{flex:0 0 min(84%,340px);scroll-snap-align:start;background:var(--deep);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s}
.pcard.flash{border-color:var(--amber)}
.pimg{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--tile)}
.pimg svg{display:block;width:100%;height:100%}
.pnum{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:var(--amber);color:var(--board);font-family:var(--mono);font-weight:600;font-size:14px;display:grid;place-items:center}
.ptxt{padding:14px 16px 16px}
.ptxt h4{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;margin:0 0 6px;line-height:1.1}
.ptxt p{margin:0;color:#c9d5e3;font-size:15px}
.cnav{display:flex;align-items:center;gap:8px}
.chint{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.cbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer;touch-action:manipulation}
.cbtn:hover{border-color:var(--amber);color:var(--amber)}
.cbtn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.map{margin:0;display:flex;flex-direction:column;gap:8px}
.mapbox{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--map-sea)}
.mapbox svg{display:block;width:100%;height:auto}
.map figcaption{font-size:13px;color:var(--muted)}
.mlbl,.mname{font-family:var(--body);font-weight:700;font-size:22px;fill:var(--ink);paint-order:stroke;stroke:var(--map-land);stroke-width:5px;stroke-linejoin:round}
.mnum{font-family:var(--mono);font-weight:600;font-size:17px;fill:var(--board)}
.msea{font-family:var(--mono);font-size:16px;letter-spacing:.3em;fill:#4f86b0}
.mstreet{font-family:var(--mono);font-size:14px;letter-spacing:.16em;fill:var(--muted)}
.mhill{font-family:var(--mono);font-size:14px;letter-spacing:.2em;fill:var(--muted)}
.mpin{cursor:pointer}
.mpin:hover circle,.mpin:focus-visible circle{fill:var(--ink)}
.mpin:focus{outline:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fact{background:var(--deep);padding:14px;display:flex;flex-direction:column;gap:2px}
.fact .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.fact .n{font-size:13px;color:var(--muted)}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.places li{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:4px 18px;padding:14px 0;border-top:1px solid var(--line)}
.places li:last-child{border-bottom:1px solid var(--line)}
.places strong{font-weight:700}
.places span{color:#c9d5e3}
@media (max-width:560px){.places li{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.plain li::marker{color:var(--amber)}
.phrases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.phrases li{display:flex;flex-direction:column;background:var(--deep);border-radius:4px;padding:10px 12px}
.phrases .es{font-weight:700;font-style:italic}
.phrases .no{color:var(--muted);font-size:14px}
.booking{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;border:1px solid var(--amber);border-radius:6px;padding:14px 16px;background:var(--deep)}
.booking .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.booking .ref{font-family:var(--mono);font-weight:600;font-size:clamp(24px,7vw,30px);letter-spacing:.18em;color:var(--amber);user-select:all;-webkit-user-select:all}
.copy{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;touch-action:manipulation}
.copy:hover{border-color:var(--amber)}
.copy:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
.copy.done{border-color:var(--amber);color:var(--amber)}
.copy svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
footer{color:var(--muted);font-size:13px;font-family:var(--mono);letter-spacing:.06em}

/* Prank: Polish takeover */
html.pl{--night:#ffffff;--deep:#fff4f6;--board:#b5102f;--tile:#ffffff;--ink:#1c1c1c;--muted:#7a5a60;--line:#f0c7cf;--amber:#dc143c;--amber-shadow:#8f0c24;--sea:#dc143c;color-scheme:light}
html.pl .stage{background:linear-gradient(#ffffff 0 50%,#dc143c 50% 100%)}
html.pl .board{border-color:#ffffff;box-shadow:0 24px 60px -24px rgba(120,0,20,.6)}
html.pl .board-head,html.pl .lbl,html.pl .gate{color:#ffd6dd}
html.pl .status{color:#ffffff}
html.pl .scrollhint{color:#ffffff}
html,body,.stage,.board,.flap{transition:background-color .6s ease,color .6s ease,border-color .6s ease}
.pl-hero{display:flex;flex-direction:column;gap:10px}
.pl-flag{display:inline-flex;flex-direction:column;width:54px;height:34px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.pl-flag i{flex:1;background:#fff}.pl-flag i+i{background:#dc143c}

.neida{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b1a2e;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center;overflow:hidden}
.neida b{font-family:var(--display);font-weight:800;font-size:clamp(60px,19vw,200px);line-height:.9;color:#ffb547;text-transform:uppercase;letter-spacing:.02em;display:block;animation:neidaPop .6s cubic-bezier(.2,1.6,.4,1) both,neidaWob 1.2s .6s ease-in-out both}
.neida span{font-family:var(--mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#c9d5e3;animation:fade .4s .7s ease both}
.neida.out{animation:fadeOut .4s ease both}
@keyframes neidaPop{from{opacity:0;transform:scale(.2) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(-5deg)}}
@keyframes neidaWob{0%,100%{transform:rotate(-5deg)}25%{transform:rotate(4deg)}50%{transform:rotate(-3deg)}75%{transform:rotate(2deg)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>[hidden]{display:none!important}</style>
</head>
<body>
<main>
  <section class="stage gutter" id="stage">
    <button class="reveal pulse" id="reveal" type="button">Avslør reisemål</button>

    <div class="board" id="board" hidden aria-label="Avgangstavle">
      <div class="board-head"><span>Avgang · Oslo</span><span>12.11.26</span></div>
      <div class="cell"><span class="lbl">Destinasjon</span><div class="flaps" id="f-city" aria-live="polite"></div></div>
      <div class="cell"><span class="lbl">Flyplass</span><div class="flaps small" id="f-code"></div></div>
      <div class="board-foot"><span class="gate">7 pax</span><span class="status blink" id="status">Søker …</span></div>
    </div>

    <a class="scrollhint" id="hint" href="#program" hidden>Programmet<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></a>
  </section>

  <div id="content" class="gutter" hidden></div>
  <div class="neida" id="neida" hidden aria-live="assertive"><b>Neida…</b><span>Selvfølgelig skal vi ikke dit</span></div>
</main>

      spin(code,FAKE.code,700);
      spin(city,FAKE.city,1100,function(){
        document.documentElement.classList.add("pl");
        statusEl.textContent="Bekreftet";statusEl.classList.remove("blink");
        setTimeout(function(){showContent(FAKE.html);},500);
        setTimeout(neida,6000);
      });
    },reduce?0:300);
  });
})();
</script>
